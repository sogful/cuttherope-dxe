name: Deploy Browser to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:
    workflow_call:
        inputs:
            version:
                description: "Version used in the downloadable browser archive."
                required: false
                type: string
            package_only:
                description: "Build the browser release without deploying GitHub Pages."
                required: false
                default: true
                type: boolean

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages-${{ inputs.package_only && 'package' || 'deploy' }}
    cancel-in-progress: true

jobs:
    content:
        uses: ./.github/workflows/content.yml

    build:
        needs: content
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-dotnet

            - name: Install wasm-tools workload
              run: dotnet workload install wasm-tools

            - name: Restore fetched assets
              uses: actions/cache/restore@v6
              with:
                  path: ${{ needs.content.outputs.cache-path }}
                  key: ${{ needs.content.outputs.cache-key }}
                  enableCrossOsArchive: true
                  fail-on-cache-miss: true

            - name: Install web content tooling
              run: python3 -m pip install --upgrade pillow fonttools

            - name: Install ffmpeg
              id: ffmpeg
              run: |
                  SCRIPT=distribution/download_ffmpeg_linux.sh
                  TAG=$(sed -n 's/^FFMPEG_BUILD_TAG="\(.*\)"$/\1/p' "$SCRIPT")
                  VERSION=$(sed -n 's/^FFMPEG_BUILD_VERSION="\(.*\)"$/\1/p' "$SCRIPT")
                  test -n "$TAG" && test -n "$VERSION"
                  RELEASE="https://github.com/BtbN/FFmpeg-Builds/releases/download/$TAG"
                  SERIES=$(echo "$VERSION" | sed 's/^n\([0-9]*\.[0-9]*\).*/\1/')
                  ARCHIVE="ffmpeg-$VERSION-linux64-lgpl-$SERIES.tar.xz"
                  cd "$RUNNER_TEMP"
                  curl -fsSL --retry 3 -O "$RELEASE/$ARCHIVE" -O "$RELEASE/checksums.sha256"
                  grep " $ARCHIVE\$" checksums.sha256 | sha256sum -c -
                  tar -xf "$ARCHIVE"
                  FFMPEG="$RUNNER_TEMP/${ARCHIVE%.tar.xz}/bin/ffmpeg"
                  "$FFMPEG" -hide_banner -encoders | grep -q libopus
                  "$FFMPEG" -hide_banner -encoders | grep -q libvpx-vp9
                  echo "CTRDX_FFMPEG=$FFMPEG" >> "$GITHUB_ENV"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

            - name: Cache converted content
              uses: actions/cache@v6
              with:
                  path: src/CutTheRopeDX.Browser/wwwroot/content
                  key: web-content-${{ steps.ffmpeg.outputs.tag }}-${{ needs.content.outputs.cache-key }}-${{ hashFiles('scripts/build_web_content.py', 'scripts/webcontent/**/*.py') }}
                  restore-keys: |
                      web-content-${{ steps.ffmpeg.outputs.tag }}-

            - name: Convert content for the browser
              run: python3 scripts/build_web_content.py --require-video

            - name: Publish Browser
              run: python3 scripts/publish_browser.py --output dist

            - name: Disable Jekyll
              run: touch dist/wwwroot/.nojekyll

            - name: Package browser release
              env:
                  RELEASE_VERSION: ${{ inputs.version }}
              run: |
                  version="${RELEASE_VERSION:-main-${GITHUB_SHA::8}}"
                  mkdir -p artifacts
                  (cd dist/wwwroot && zip -qr "../../artifacts/CutTheRopeDX-$version-Browser.zip" .)

            - name: Upload browser release
              uses: actions/upload-artifact@v7
              with:
                  name: bundle-browser
                  path: artifacts/*.zip
                  compression-level: 0
                  retention-days: 7

            - name: Upload Pages artifact
              if: inputs.package_only != true
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist/wwwroot

    deploy:
        needs: build
        if: inputs.package_only != true
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
