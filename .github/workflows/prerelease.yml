name: Prerelease
 
on:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: prerelease
    cancel-in-progress: false

jobs:
    release:
        permissions:
            contents: write
            pages: write
            id-token: write
        uses: ./.github/workflows/release.yml
        with:
            version: 1.0.0-prerelease+${{ github.run_id }}
