name: Release Ports

on:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    assets:
        uses: ./.github/workflows/content.yml

    android:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup-dotnet

            - name: Install Android workload
              run: dotnet workload install android

            - name: Install Android SDK dependencies
              run: >-
                  dotnet build
                  src/CutTheRopeDX.Android/CutTheRopeDX.Android.csproj
                  -t:InstallAndroidDependencies
                  -f net10.0-android36.0
                  -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT
                  -p:AcceptAndroidSDKLicenses=true

            - name: Restore Android-formatted assets
              shell: pwsh
              run: ./ports/android/tools/restore-assets.ps1

            - name: Build Android APK
              run: >-
                  dotnet build
                  src/CutTheRopeDX.Android/CutTheRopeDX.Android.csproj
                  -c Release
                  -p:Version=1.0.0
                  -p:ApplicationDisplayVersion=1.0.0
                  -p:ApplicationVersion=${{ github.run_number }}
                  -p:AndroidPackageFormat=apk

            - name: Package Android release
              run: |
                  mkdir -p artifacts
                  apk=$(find src/CutTheRopeDX.Android/bin/Release/net10.0-android36.0 -name '*-Signed.apk' -print -quit)
                  if [ -z "$apk" ]; then
                      apk=$(find src/CutTheRopeDX.Android/bin/Release/net10.0-android36.0 -name '*.apk' -print -quit)
                  fi
                  test -n "$apk"
                  cp "$apk" artifacts/CutTheRopeDX.apk

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-android
                  path: artifacts/CutTheRopeDX.apk
                  compression-level: 0
                  retention-days: 7

    ds:
        needs: assets
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-dotnet

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: ports/ds/tools/requirements.txt

            - name: Restore fetched assets
              uses: actions/cache/restore@v6
              with:
                  path: ${{ needs.assets.outputs.cache-path }}
                  key: ${{ needs.assets.outputs.cache-key }}
                  enableCrossOsArchive: true

            - name: Install DS asset dependencies
              run: python -m pip install -r ports/ds/tools/requirements.txt

            - name: Restore converted DS assets
              id: ds-assets
              uses: actions/cache/restore@v6
              with:
                  path: |
                      ports/ds/generated/**/*.bin
                      ports/ds/generated/**/*.hpp
                      ports/ds/generated/**/*.json
                      ports/ds/generated/**/*.lz
                      ports/ds/generated/**/*.s
                  key: ds-assets-v1-${{ hashFiles('content/file_manifest.json', 'content/**/*.json', 'content/**/*.xml', 'ports/ds/tools/**/*.py', 'ports/ds/assets/feedcandy.png', 'src/CutTheRopeDX.Core/**/*.cs', 'src/CutTheRopeDX.Rendering.Skia/**/*.cs', 'src/CutTheRopeDX.Rendering.Skia.Tests/**/*.cs', 'ports/roblox/src/**/*.luau') }}

            - name: Restore baked costume animations
              if: steps.ds-assets.outputs.cache-hit != 'true'
              id: ds-skins
              uses: actions/cache/restore@v6
              with:
                  path: ports/roblox/generated/omnom-baked
                  key: ds-skins-v1-${{ hashFiles('content/file_manifest.json', 'content/images/animations/**/*.json', 'content/images/animations/**/*.xml', 'src/CutTheRopeDX.Core/**/*.cs', 'src/CutTheRopeDX.Rendering.Skia/**/*.cs', 'src/CutTheRopeDX.Rendering.Skia.Tests/**/*.cs') }}

            - name: Convert Nintendo DS assets
              if: steps.ds-assets.outputs.cache-hit != 'true'
              run: python ports/ds/tools/build.py --assets-only

            - name: Save baked costume animations
              if: steps.ds-assets.outputs.cache-hit != 'true' && steps.ds-skins.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: ports/roblox/generated/omnom-baked
                  key: ${{ steps.ds-skins.outputs.cache-primary-key }}

            - name: Save converted DS assets
              if: steps.ds-assets.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: |
                      ports/ds/generated/**/*.bin
                      ports/ds/generated/**/*.hpp
                      ports/ds/generated/**/*.json
                      ports/ds/generated/**/*.lz
                      ports/ds/generated/**/*.s
                  key: ${{ steps.ds-assets.outputs.cache-primary-key }}

            - name: Install BlocksDS toolchain
              shell: pwsh
              run: ./ports/ds/tools/setup.ps1

            - name: Build Nintendo DS ROM
              run: python ports/ds/tools/build.py --reuse-assets

            - name: Package Nintendo DS release
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Path artifacts | Out-Null
                  Copy-Item ports/ds/dist/cuttherope.nds artifacts/CutTheRopeDX.nds

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-ds
                  path: artifacts/CutTheRopeDX.nds
                  compression-level: 0
                  retention-days: 7

    roblox:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Package Rojo source
              run: |
                  mkdir -p artifacts
                  zip -qr artifacts/CutTheRopeDXRoblox.zip \
                      ports/roblox/src \
                      ports/roblox/tests \
                      ports/roblox/default.project.json \
                      README.md

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-roblox
                  path: artifacts/CutTheRopeDXRoblox.zip
                  compression-level: 0
                  retention-days: 7

    release:
        needs: [android, ds, roblox]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/download-artifact@v8
              with:
                  pattern: bundle-*
                  path: artifacts
                  merge-multiple: true

            - name: Move rolling release tag
              run: |
                  git tag --force latest "$GITHUB_SHA"
                  git push origin refs/tags/latest --force

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: latest
                  name: latest builds
                  prerelease: false
                  make_latest: true
                  files: |
                      artifacts/CutTheRopeDX.apk
                      artifacts/CutTheRopeDX.nds
                      artifacts/CutTheRopeDXRoblox.zip
                  fail_on_unmatched_files: true
                  generate_release_notes: false
